[package]
name = "radiation-sim"
version = "0.1.0"
edition = "2021"
description = "Terminalowy symulator promieniowania ciała czarnego (prawo Stefana–Boltzmanna)"
license = "MIT OR Apache-2.0"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
approx = "0.5"
criterion = "0.5"


[[bench]]
name = "perf"
harness = false